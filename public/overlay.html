<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Code W Claw Overlay</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="overlay-body">
  <section class="machine overlay-machine" id="machine">
    <div class="machine-crown">
      <div class="star">✦</div><div class="code-title">CODE W</div><div class="star">✦</div>
      <div class="shuffle-sign">SHUFFLE</div>
    </div>
    <div class="machine-frame">
      <div class="top-lights"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="glass-panel">
        <div class="sparkles"></div>
        <div class="rail"></div>
        <div class="claw" id="claw">
          <div class="cable"></div>
          <div class="claw-head"><span>W</span></div>
          <div class="claw-arms"><i></i><i></i><i></i></div>
        </div>
        <div class="plush-pit" id="plushies"></div>
        <div class="winner-card" id="winnerCard" aria-live="polite"></div>
      </div>
      <div class="control-deck">
        <div class="joystick"><span></span></div>
        <div class="deck-screen"><strong>CODE W</strong><span id="deckMessage">TYPE !CODEW TO ENTER</span></div>
        <div class="shuffle-button decorative">SHUFFLE</div>
      </div>
    </div>
  </section>
  <div id="entryList" hidden></div><div id="chatList" hidden></div>
  <span id="count" hidden></span><span id="status" hidden></span><span id="metricEntries" hidden></span><span id="metricUnique" hidden></span><span id="latestEntry" hidden></span><span id="entryBadge" hidden></span><span id="kickStatus" hidden></span><span id="footerKeyword" hidden></span>
  <input id="keyword" hidden><input id="prize" hidden>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/overlay.js"></script>
</body>
</html>
