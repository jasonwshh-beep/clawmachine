<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Code W Claw Overlay</title><link rel="stylesheet" href="/style.css"></head><body class="overlay"><div class="app"><div class="machine" id="machine"><div class="machine-top">CODE W<small>SHUFFLE</small></div><div class="claw-rail"></div><div class="claw"><div class="cable"></div><div class="hub">W</div><div class="arms">⌯</div></div><div class="glass"></div><div class="plushies" id="plushies"></div><div class="winner-card" id="winnerCard"></div><div id="entryList" hidden></div><span id="count" hidden></span><span id="status" hidden></span><input id="keyword" hidden><input id="prize" hidden></div></div><script src="/socket.io/socket.io.js"></script><script>const socket=io(),$=s=>document.querySelector(s);let state={};function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(s){state=s;$('#plushies').innerHTML=s.entrants.map(e=>`<div class="plush" id="p-${e.id}" style="background:${e.color}"><div class="face">${e.animal}</div><div class="name">${esc(e.username)}</div></div>`).join('');if(s.winner)show(s.winner)}function show(e){$('#winnerCard').innerHTML=`<div class="big">${e.animal}</div><small>${esc(state.prize)} WINNER</small><h3>${esc(e.username)}</h3><div>CODE W • SHUFFLE</div>`;$('#winnerCard').classList.add('show')}socket.on('state',render);socket.on('draw:start',({winnerId})=>{$('#winnerCard').classList.remove('show');$('#machine').classList.add('draw');const idx=state.entrants.findIndex(e=>e.id===winnerId),cols=Math.max(1,Math.floor($('#plushies').clientWidth/82)),x=((idx%cols)+.5)/cols*84+8;$('.claw').style.left=x+'%';setTimeout(()=>{const p=$('#p-'+winnerId);if(p){p.style.transform='translateY(-180px) scale(1.15)';p.style.zIndex=7}},4200)});socket.on('draw:winner',e=>{$('#machine').classList.remove('draw');show(e)});socket.on('reset',()=>$('#winnerCard').classList.remove('show'));</script></body></html>
