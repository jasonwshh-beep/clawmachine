<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Code W Claw Dashboard</title><link rel="stylesheet" href="/style.css"></head><body><div class="app"><header class="brand"><h1><span>CODE W</span> CLAW GIVEAWAY</h1><div class="badge">SHUFFLE</div></header><main class="grid"><section class="panel"><h2>Giveaway controls</h2><div class="field"><label>Chat keyword</label><input id="keyword" value="!codew"></div><div class="field"><label>Prize</label><input id="prize" value="$200"></div><button class="btn primary" id="save">Save settings</button><div class="stats"><div class="stat"><b id="count">0</b><small>Entries</small></div><div class="stat"><b>LIVE</b><small>Socket sync</small></div></div><div class="btns"><button class="btn primary" id="open">Open entries</button><button class="btn" id="close">Close entries</button><button class="btn primary" id="draw">DROP THE CLAW</button><button class="btn" id="demo">Add demo plushies</button><button class="btn danger" id="reset">Reset giveaway</button></div><p class="footer-note">OBS source: <b>/overlay.html</b><br>Chat relay endpoint: <b>POST /api/chat</b></p></section><section class="machine-wrap"><div class="machine" id="machine"><div class="machine-top">CODE W<small>SHUFFLE</small></div><div class="claw-rail"></div><div class="claw"><div class="cable"></div><div class="hub">W</div><div class="arms">⌯</div></div><div class="glass"></div><div class="plushies" id="plushies"></div><div class="winner-card" id="winnerCard"></div></div></section><section class="panel"><h2>Live entrants</h2><div class="status" id="status">Entries closed</div><div class="field"><label>Add entrant manually</label><input id="manual" placeholder="Kick username"></div><button class="btn" id="add">Add plushie</button><div class="entry-list" id="entryList"></div></section></main></div><script src="/socket.io/socket.io.js"></script><script src="/app.js"></script></body></html>
